[project]
name = "colorizador-fotos"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.2,<2",
    "diffusers>=0.32,<1",
    "gradio>=5.16,<6",
    "numpy>=1.26,<3",
    "pillow>=11,<13",
    "safetensors>=0.5,<1",
    "torch>=2.6,<3",
    "transformers>=4.49,<5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
notebook = [
    "ipykernel>=6.29,<7",
]
